services:
  postgres:
    image: postgres:16-alpine
    container_name: brokenvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brokenvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brokenvault}
      POSTGRES_DB: ${POSTGRES_DB:-brokenvault}
    ports:
      - "5432:5432"
    volumes:
      - brokenvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brokenvault_pgdata:
